career-profile:
  title: 职业概况
  summary: |
    美国爱荷华大学计算机科学硕士，聚焦大模型技术（LLMs/Transformers）研发与产业落地，兼具算法创新与工程化能力。精通PyTorch等深度学习框架，熟悉大模型全流程开发——从预训练微调（LoRA/PEFT）、RLHF优化到知识增强（RAG/Prompt Engineering），以及分布式训练与推理加速

    在美国Casey's Store Support Center担任软件工程师实习生，主导.NET 8系统升级与企业级数据平台性能优化，落地DevOps与CI/CD流程，提升开发效率与系统稳定性

    拥有多项AI项目经验，包括医学影像分析、自动语音识别、多模态数据处理等AI项目，覆盖数据清洗、模型设计、训练调优到部署上线全链路，具备端到端问题解决能力

    擅长将AI技术与业务场景结合，推动技术落地（如医疗/零售领域），强跨团队协作与产品思维，<strong>目标岗位：大模型应用开发/训练/评测</strong>，致力于用AI解决真实业务挑战并创造可持续价值

