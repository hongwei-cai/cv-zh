projects:
  title: 项目
  intro: >
    以下是我曾经独立完成或参与过的项目
  assignments:
  - title: 医疗AI专家系统
    link: "https://github.com/hongwei-cai/medical-ai-data-pipeline"
    tagline: |
      开发了一套基于RAG架构的医疗AI系统，整合多模态数据（Excel/影像）实现智能检索与分析。核心MVP在3小时内完成，展现了高效的全栈开发能力。
      <ul>
      <li><strong>快速交付</strong>：3小时内完成ETL、后端及Streamlit UI的端到端开发。</li>
      <li><strong>多模态融合</strong>：统一清洗结构化病历与非结构化医学影像数据。</li>
      <li><strong>智能功能</strong>：集成ChromaDB与Qwen模型，提供复杂语义查询与交互式图表。</li>
      </ul>
      <strong>技术栈</strong>：Python, LangChain, Streamlit, ChromaDB, Qwen-Max/VL

  - title: 数字医生经验卡系统
    link: "https://github.com/hongwei-cai/md-expert-card-system"
    tagline: |
      构建基于 "Visit-Trajectory-Knowledge" 三层架构 的可泛化医生经验卡系统，旨在解决医疗大模型在私有知识应用中的“黑盒”与“幻觉”痛点。
      <ul>
      <li><strong>三层架构</strong>：从EHR中精准抽取结构化临床切片(VisitCard)，聚合生成时序病程轨迹(TrajectoryCard)，沉淀可复用医学知识(KnowledgeCard)。</li>
      <li><strong>可控RAG</strong>：采用代码级Embedding Policy确保索引纯净，融合语义向量与临床特征重排(Clinical Scoring)优化检索。</li>
      <li><strong>闭环可解释性</strong>：生成端强制执行严格的证据引用机制，实现从诊断建议到原始病历的逐级溯源。</li>
      </ul>
      <strong>技术栈</strong>：LangChain (LCEL), Pydantic (Schema Validation), Milvus (Vector Store), Streamlit (Interactive UI), Python (Async Pipeline), Pytest (Regression Testing)

  - title: 主动脉瓣关闭不全快速诊断系统（AI医学影像分析）
    link: "https://github.com/hongwei-cai/RapidAoV"
    tagline: |
      基于nnU-Net开发AI影像分析流程，实现CT扫描中主动脉根部和瓣膜的自动分割，优化诊断指标以区分正常与病变病例。
      <ul>
      <li><strong>自动分割</strong>：利用nnU-Net实现主动脉根部和瓣膜的高精度自动分割，提升主动脉瓣关闭不全检测准确性。</li>
      <li><strong>诊断优化</strong>：结合XGBoost与临床指标分析，有效区分正常与病变病例。</li>
      <li><strong>LLM应用</strong>：通过微调模型优化LLM在健康领域的应用，增强问题理解和计划生成能力。</li>
      </ul>
      <strong>技术栈</strong>：nnU-Net, XGBoost, ITK, OpenCV, JupyterLab, HPC, DataViewerCartesian

  - title: 自动语音识别（ASR）系统
    link: "https://github.com/hongwei-cai/ASR-System"
    tagline: |
      实现基于连接时序分类（CTC）的深度前馈神经网络，结合动态规划和维特比搜索优化语音流对齐。
      <ul>
      <li><strong>核心算法</strong>：构建深度前馈神经网络，利用CTC损失函数处理不定长语音序列。</li>
      <li><strong>解码优化</strong>：采用束搜索(Beam Search)解码与强制对齐策略，显著提升识别准确率。</li>
      <li><strong>训练效率</strong>：应用动态训练策略优化大规模语音数据集的训练过程。</li>
      </ul>
      <strong>技术栈</strong>：Python, PyTorch, Kaldi, NumPy, JSON

  - title: 基于CycleGAN的多模态MRI合成
    link: "https://github.com/hongwei-cai/Cross-Modality-MRI-Synthesis-with-CycleGANs"
    tagline: |
      复现2D CycleGAN模型，实现T1与T2 MRI模态间的高质量转换，解决跨模态数据稀缺问题。
      <ul>
      <li><strong>模型架构</strong>：采用PatchGAN判别器和残差生成器，显著提升图像纹理细节与转换质量。</li>
      <li><strong>训练优化</strong>：结合Adam优化器和指数衰减调度策略，有效解决GAN训练不稳定的问题。</li>
      <li><strong>应用价值</strong>：实现不同MRI模态间的无监督转换，辅助医学影像分析与数据增强。</li>
      </ul>
      <strong>技术栈</strong>：PyTorch, MONAI, NumPy, Pandas, Matplotlib, Slicer, Horos

  - title: Netflix 数据整理、探索分析与元数据增强
    link: "https://github.com/hongwei-cai/Netflix-Data-Wrangling-Exploration-Metadata-Enrichment"
    tagline: |
      对Netflix数据集进行全流程数据分析与挖掘，结合外部API丰富数据维度，提炼关键业务洞察。
      <ul>
      <li><strong>数据清洗</strong>：利用Pandas/NumPy处理缺失值与重复值，建立标准化的数据预处理流程。</li>
      <li><strong>可视化洞察</strong>：使用Matplotlib/Seaborn/Plotly揭示内容分布、发布趋势及年龄评级关联。</li>
      <li><strong>特征增强</strong>：集成OMDb API引入外部评分，通过特征工程丰富数据维度，支持高预测性能模型。</li>
      </ul>
      <strong>技术栈</strong>：Python (Pandas/NumPy/Matplotlib/Seaborn/Plotly), OMDb API, Jupyter Notebook


