projects:
  title: 项目
  intro: >
    以下是我曾经独立完成或参与过的研究项目
  assignments:
  - title: 多模态企业知识管理智能体
    link: "https://github.com/hongwei-cai/Multi-modal-Enterprise-KM-Agent"
    tagline: |

      <strong>项目概述</strong><br><br>
      基于检索增强生成（RAG）架构的多模态AI智能体，旨在解决企业知识管理中的信息孤岛问题。通过整合私有文档库，实现精准问答、知识推理和多模态检索，提升企业决策效率和知识利用率。项目采用敏捷开发方法，已完成核心功能迭代，支持本地高效部署和企业级应用。<br><br>

      <strong>核心功能迭代</strong><br>
      <ul>
      <li><strong>Sprint 1（已完成）：构建端到端文本Q&A流水线</strong>
        <ul>
        <li>实现PDF文档智能解析和分块处理，支持滑动窗口策略和重叠分块</li>
        <li>集成ChromaDB向量数据库，使用BAAI/bge-m3嵌入模型进行语义检索</li>
        <li>部署DialoGPT-medium模型于本地vLLM服务器，实现高效推理</li>
        <li>开发FastAPI服务接口，支持文档上传、问答查询和错误处理</li>
        <li>容器化部署，使用Docker和Docker Compose实现生产级服务编排</li>
        </ul>
      </li>
      <li><strong>Sprint 2（已完成）：模型定制与性能优化</strong>
        <ul>
        <li>实现LoRA微调框架，针对DialoGPT-medium等模型优化，减少可训练参数99.67%</li>
        <li>集成PEFT库，支持M1 Pro芯片的量化优化（4-bit/8-bit）和内存管理</li>
        <li>搭建MLflow实验追踪系统，使用SQLite后端记录模型性能指标和资源使用情况</li>
        <li>开发A/B测试框架，支持模型版本比较和动态切换</li>
        <li>实现模型缓存和热插拔机制，提升推理响应速度29.1%</li>
        </ul>
      </li>
      <li><strong>Sprint 3（进行中）：生产化部署与多模态扩展</strong>
        <ul>
        <li>集成CLIP模型实现图像编码和跨模态检索，支持图文混合查询</li>
        <li>扩展ChromaDB支持多模态嵌入存储，实现文本-图像联合检索</li>
        <li>设计多模态提示模板，优化上下文融合和推理质量</li>
        <li>构建生产级异步服务架构，支持请求队列管理和负载均衡</li>
        </ul>
      </li>
      </ul><br>

      <strong>技术栈</strong><br>
      <ul>
      <li><strong>AI/ML框架</strong>：PyTorch, Transformers, PEFT (LoRA), vLLM, sentence-transformers</li>
      <li><strong>核心模型</strong>：BAAI/bge-m3, BAAI/bge-large-zh, DialoGPT-medium, Phi-2, CLIP</li>
      <li><strong>数据与检索</strong>：ChromaDB, PyPDF, 智能文本分块, 多模态嵌入</li>
      <li><strong>后端与部署</strong>：FastAPI, Docker, Docker-compose, GitHub Actions</li>
      <li><strong>实验与运维</strong>：MLflow, Pydantic, 量化优化</li>
      </ul><br>

      <strong>核心成就</strong><br>
      <ul>
      <li><strong>系统架构</strong>：设计并实现完整的RAG架构，支持文档解析、向量检索、LLM推理和服务部署，处理企业级文档量（支持PDF格式，智能分块确保检索精度）</li>
      <li><strong>性能优化</strong>：通过LoRA微调和量化技术，将DialoGPT-medium模型的可训练参数从354M减少至1.18M，参数效率提升99.7%，推理速度提升29.1%，同时保持回答质量稳定（基于MLflow实验数据验证）</li>
      <li><strong>工程规范</strong>：建立标准化开发流程，包括pre-commit代码质量检查、类型注解（mypy）和单元测试覆盖，实现协作效率提升和代码可维护性</li>
      <li><strong>业务价值</strong>：精准处理企业文档，回答准确率达85%以上，支持本地部署避免数据安全风险，为企业知识管理提供高效解决方案</li>
      </ul>

  - title: 主动脉瓣关闭不全快速诊断系统（AI医学影像分析）
    link: "https://github.com/hongwei-cai/RapidAoV"
    tagline: |
      基于nnU-Net开发AI影像分析流程，实现CT扫描中主动脉根部和瓣膜的自动分割，优化诊断指标以区分正常与病变病例，提升主动脉瓣关闭不全检测的准确性。技术栈：nnU-Net、XGBoost, Insight Toolkit (ITK)、OpenCV、JupyterLab、高性能计算（HPC）、DataViewerCartesian

  - title: 自动语音识别（ASR）系统
    link: "https://github.com/hongwei-cai/ASR-System"
    tagline: |
      实现基于连接时序分类（CTC）的深度前馈神经网络，结合动态规划和维特比搜索优化语音流对齐；采用强制对齐、束搜索解码和动态训练策略，优化大规模语音数据集的训练效率。技术栈：Python、PyTorch、Kaldi、NumPy、JSON

  - title: 基于CycleGAN的多模态MRI合成
    link: "https://github.com/hongwei-cai/Cross-Modality-MRI-Synthesis-with-CycleGANs"
    tagline: |
      复现2D CycleGAN模型，实现T1与T2 MRI模态间的转换；采用PatchGAN判别器和残差生成器提升图像转换质量，结合Adam优化器和指数衰减调度策略稳定GAN训练。技术栈：Google Colab、PyTorch、NumPy、Pandas、Matplotlib、MONAI、Slicer、Horos

  - title: Netflix 数据整理、探索分析与元数据增强
    link: "https://github.com/hongwei-cai/Netflix-Data-Wrangling-Exploration-Metadata-Enrichment"
    tagline: |
      通过 Pandas/NumPy 实现缺失值处理、重复值剔除与字段标准化；利用 Matplotlib/Seaborn/Plotly 可视化内容类型分布、国家/地区发布趋势及年龄评级关联，提炼关键业务洞察；结合 OMDb API 集成 IMDB/Rotten Tomatoes 等外部评分，通过特征工程（如类型标签、地区映射）丰富数据维度。高预测性能。技术栈：Python（Pandas/NumPy/Matplotlib/Seaborn/Plotly）、数据清洗与预处理、EDA 可视化、API 集成（OMDb）、特征工程、Jupyter Notebook

  - title: 基于EDSR的图像超分辨率增强
    link: "#"
    tagline: |
      复现增强深度超分辨率（EDSR）模型，采用模块化残差块结构提升单尺度图像分辨率，对比传统方法（如SRCNN、SRResNet）显著改善细节还原能力。技术栈：PyTorch、EDSR架构、残差学习

